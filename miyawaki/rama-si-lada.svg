<text x="108" y="744" font-size="14" fill="#333" text-anchor="start">Cuie pe scânduri la 0,50 · 1,00 · 1,50 m (sus/jos) și la 0,25 · 0,75 · 1,25 · 1,75 m</text>
<text x="108" y="766" font-size="14" fill="#333" text-anchor="start">(stânga/dreapta); sfori întinse între cuiele opuse — cele 12 intersecții sunt pozițiile de</text>
<text x="108" y="788" font-size="14" fill="#333" text-anchor="start">plantat. Culoarea = stratul (A arbori mari, B arbori, C arbuști mari, D arbuști).</text>
<text x="108" y="810" font-size="14" fill="#333" text-anchor="start">Numerotarea: de la nord (latura roșie) spre sud, de la vest spre est: 1–3, 4–6, 7–9, 10–12.</text>
<text x="108" y="832" font-size="14" fill="#333" text-anchor="start">Pozițiile 3 și 7 (cercuri mari) sunt arborii mari.</text>
<text x="108" y="854" font-size="14" fill="#333" text-anchor="start">Șipcă de 4,8 × 2,4 cm (4 bucăți de 2,05 m), colțuri cu plăcuțe metalice, o diagonală ca să</text>
<text x="108" y="876" font-size="14" fill="#333" text-anchor="start">nu se strâmbe, două mânere; se mută de doi oameni.</text>
<text x="108" y="898" font-size="14" fill="#333" text-anchor="start">Mutarea: latura de vest a ramei se pune peste linia unde a fost latura de est a pătratului</text>
<text x="108" y="920" font-size="14" fill="#333" text-anchor="start">anterior (lipite); la fiecare 5 pătrate, control cu ruleta de la gard.</text>
<text x="108" y="942" font-size="14" fill="#333" text-anchor="start">Legenda culorilor din desen este cea a rețetei I2; la celelalte rețete pozițiile sunt</text>
<text x="108" y="964" font-size="14" fill="#333" text-anchor="start">aceleași, se schimbă doar speciile din pahare.</text>
<text x="806" y="92" font-size="22" fill="#333" text-anchor="start" font-weight="700">2. Lada rețetei: 12 pahare numerotate ca pozițiile din ramă</text>
