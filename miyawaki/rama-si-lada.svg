<text x="1285" y="455" font-size="13" fill="#333" text-anchor="middle">pahar de 1 l în secțiune</text>
<text x="1285" y="473" font-size="13" fill="#333" text-anchor="middle">mocirlă pe fund, rădăcina în ea</text>
<text x="1285" y="491" font-size="13" fill="#333" text-anchor="middle">numărul mare pe perete</text>
<text x="1285" y="509" font-size="13" fill="#333" text-anchor="middle">codul speciei sub pahar</text>
<text x="806" y="642" font-size="14" fill="#333" text-anchor="start">Ladă de legume de 60 × 40 cm, ținută cu latura scurtă spre nord (marcată „N”); 12 pahare</text>
<text x="806" y="664" font-size="14" fill="#333" text-anchor="start">de 1 l (sau pungi) numerotate cu marker 1–12, așezate exact ca în ramă: 1–3 lângă „N”,</text>
<text x="806" y="686" font-size="14" fill="#333" text-anchor="start">10–12 la celălalt capăt.</text>
<text x="806" y="708" font-size="14" fill="#333" text-anchor="start">În pahar: puietul cu rădăcina în mocirlă (pământ cu apă), ca să nu se usuce între</text>
<text x="806" y="730" font-size="14" fill="#333" text-anchor="start">sortare și plantare. Pe fundul paharului, codul speciei, scris mic, pentru control.</text>
<text x="806" y="752" font-size="14" fill="#333" text-anchor="start">Eticheta lăzii: rețeta și pătratul (ex. I2 → C7). 12–15 lăzi în circuit; sortatorul le</text>
<text x="806" y="774" font-size="14" fill="#333" text-anchor="start">umple la masă din snopii speciilor, cu fișa rețetei în față; echipa din teren le ia pe</text>
<text x="806" y="796" font-size="14" fill="#333" text-anchor="start">rând.</text>
<text x="806" y="840" font-size="22" fill="#333" text-anchor="start" font-weight="700">3. Un pătrat, în 6–8 minute, cu doi oameni</text>
<text x="806" y="874" font-size="14" fill="#333" text-anchor="start">① Rama se așază pe pătratul următor, cu latura roșie spre gardul de nord; se citește pe</text>
<text x="806" y="896" font-size="14" fill="#333" text-anchor="start">   planșă eticheta pătratului și rețeta (de exemplu C7 · I2).</text>
<text x="806" y="918" font-size="14" fill="#333" text-anchor="start">② Se ia lada cu eticheta rețetei. Paharul 1 se plantează la intersecția 1 a sforilor,</text>
<text x="806" y="940" font-size="14" fill="#333" text-anchor="start">   paharul 2 la 2 … până la 12.</text>
<text x="806" y="962" font-size="14" fill="#333" text-anchor="start">③ Regula de sărit: intersecția care cade pe alee, în luminiș sau dincolo de linia de var</text>
<text x="806" y="984" font-size="14" fill="#333" text-anchor="start">   se sare; paharul rămâne în ladă și se întoarce la sortator.</text>
<text x="806" y="1006" font-size="14" fill="#333" text-anchor="start">④ Cazmaua: despicătură, puietul cu coletul la nivelul solului, închis cu călcâiul, un</text>
<text x="806" y="1028" font-size="14" fill="#333" text-anchor="start">   smuls ușor de verificare. Apoi rama se mută cu o latură mai departe.</text>
<text x="806" y="1050" font-size="14" fill="#333" text-anchor="start">⑤ Trasatorul bifează pătratul pe lista lăzilor; apa și mulciul vin în urmă, pe rânduri</text>
<text x="806" y="1072" font-size="14" fill="#333" text-anchor="start">   întregi de pătrate.</text>
</svg>