<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLU--></title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #c9d1d9;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: #58a6ff; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 16px 70px; }

  header { border-bottom: 1px solid #21262d; padding-bottom: 22px; }
  .eyebrow { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #6e7681; }
  h1 { margin: 8px 0 10px; font-size: clamp(22px, 4vw, 32px); color: #7ee787; font-weight: 700; line-height: 1.15; }
  .lead { color: #8b949e; max-width: 72ch; margin: 0 0 4px; }
  .lead + .lead { margin-top: 10px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .stat {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 8px 12px; min-width: 88px;
  }
  .stat b { display: block; font-size: 19px; color: #c9d1d9; }
  .stat span { font-size: 11px; color: #8b949e; }

  h2 { margin: 34px 0 12px; font-size: 16px; color: #c9d1d9; }
  h2 .n { font-size: 11px; color: #6e7681; font-weight: 400; margin-left: 8px; }

  .takeaways { margin: 22px 0 0; padding: 0; list-style: none; }
  .takeaways li {
    position: relative; padding-left: 20px; margin-bottom: 7px;
    color: #8b949e; max-width: 78ch;
  }
  .takeaways li::before { content: "▸"; position: absolute; left: 2px; color: #7ee787; }
  .takeaways b { color: #c9d1d9; }

  /* filtre */
  #filtre { display: flex; flex-wrap: wrap; gap: 6px; margin: 26px 0 4px; position: sticky; top: 0;
            background: #0d1117; padding: 10px 0; z-index: 20; border-bottom: 1px solid #21262d; }
  .chip {
    border: 1px solid #30363d; background: #161b22; color: #c9d1d9;
    border-radius: 999px; padding: 5px 13px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: .15s;
  }
  .chip:hover { border-color: #58a6ff; }
  .chip.on { background: #238636; border-color: #2ea043; color: #fff; font-weight: 600; }

  /* grila de fise */
  #grid { display: grid; gap: 12px; margin-top: 16px;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column;
  }
  .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
  .card .ph { aspect-ratio: 4 / 3; background: #0d1117; position: relative; }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block;
                  opacity: 0; transition: opacity .3s; }
  .card .ph img.gata { opacity: 1; }
  .card .body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
  .card .ro { font-weight: 700; color: #c9d1d9; line-height: 1.3; }
  .card .lat { font-style: italic; color: #8b949e; font-size: 12px; margin-top: 1px; }
  .card .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

  .tag { font-size: 9.5px; padding: 2px 7px; border-radius: 12px; color: #fff; font-weight: 600;
         letter-spacing: .3px; }
  .t-arbore   { background: #1f6f3f; }
  .t-arbust   { background: #6d7c2f; }
  .t-conifer  { background: #1a6f73; }
  .t-spontan  { background: #7b6440; }
  .tag.plan   { background: #1f6feb; }
  .tag.prob   { background: #9e3b2e; }
  .tag.incert { background: #30363d; color: #8b949e; }

  .lumbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px;
              font-weight: 600; border-radius: 12px; padding: 2px 8px; border: 1px solid;
              background: #0d1117; }
  .l-soare { border-color: #8a6d1f; color: #e3b341; }
  .l-mixt  { border-color: #2d5a3d; color: #7ee787; }
  .l-umbra { border-color: #2f4a6d; color: #79c0ff; }
  #f-lum { margin-bottom: 6px; }
  #f-lumd { font-size: 11.5px; color: #8b949e; line-height: 1.5; margin-bottom: 12px; }
  #f-lumd:empty { display: none; }

  .verdict { margin-top: 9px; font-size: 11.5px; line-height: 1.45; color: #8b949e; }
  .verdict b { font-weight: 700; }
  .v-retine b { color: #7ee787; }
  .v-evita  b { color: #f78166; }
  .v-neutru b { color: #d29922; }

  /* fisa mare */
  #bg { display: none; position: fixed; inset: 0; background: rgba(1,4,9,.7); z-index: 100; }
  #bg.on { display: block; }
  #fisa {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 860px; max-width: 94vw; max-height: 92vh; overflow-y: auto;
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 18px 20px 20px; z-index: 110;
    box-shadow: 0 10px 44px rgba(0,0,0,.8);
  }
  #fisa.on { display: block; }
  #fh { display: flex; align-items: flex-start; gap: 12px; }
  #fh > div:first-child { flex: 1; min-width: 0; }
  #f-ro { font-size: 20px; font-weight: 700; color: #7ee787; }
  #f-lat { font-style: italic; color: #8b949e; font-size: 13px; margin-top: 2px; }
  #f-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    border: 1px solid #30363d; background: #21262d; color: #c9d1d9;
    border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: #58a6ff; }

  #f-body { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
  #f-poze { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #f-poze.una { grid-template-columns: 1fr; }
  #f-poze.una a { aspect-ratio: 4 / 3; }   /* o singură poză: preview mai scund */
  #f-poze a { display: block; position: relative; aspect-ratio: 3 / 4; border-radius: 7px;
              overflow: hidden; border: 1px solid #21262d; }
  #f-poze img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #f-poze span { position: absolute; left: 5px; bottom: 5px; background: rgba(1,4,9,.8);
                 border-radius: 4px; padding: 1px 6px; font-size: 10px; color: #c9d1d9; }
  .sec { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #8b949e;
         margin: 0 0 5px; }
  .sec + .sec { margin-top: 14px; }
  table.kv { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.kv td { padding: 4px 0; border-bottom: 1px solid #21262d; font-size: 12px; }
  table.kv td:first-child { color: #8b949e; }
  table.kv td:last-child { text-align: right; font-weight: 700; color: #c9d1d9; }
  table.kv tr:last-child td { border-bottom: none; }
  #f-nota, #f-crucea { font-size: 12.5px; line-height: 1.55; color: #a9b3bd; margin-bottom: 12px; }
  #f-crucea { border-left: 2px solid #238636; padding-left: 10px; }
  #f-prob {
    font-size: 12px; line-height: 1.5; color: #ffb4a2; background: rgba(158,59,46,.14);
    border: 1px solid #7d3227; border-radius: 7px; padding: 8px 10px; margin-bottom: 12px;
  }
  #f-prob:empty, #f-crucea:empty { display: none; }

  .cal { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
  .cal div { height: 22px; border-radius: 3px; display: flex; align-items: center;
             justify-content: center; font-size: 9px; }
  .calm { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin-top: 3px; }
  .calm span { font-size: 8px; text-align: center; color: #6e7681; }
  .s-repaus       { background: #2c2c2c; }
  .s-persistent   { background: #1e3a2f; }
  .s-vegetatie    { background: #14532d; }
  .s-inflorire    { background: #831843; }
  .s-fructificare { background: #7c2d12; }
  .legenda { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 10.5px; color: #8b949e; }
  .legenda i { width: 11px; height: 11px; border-radius: 3px; display: inline-block;
               margin-right: 4px; vertical-align: -1px; font-style: normal; }
  #f-link { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  #f-link a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
              color: #58a6ff; text-decoration: none; padding: 6px 9px; border-radius: 6px;
              border: 1px solid #1f4a7a; background: rgba(31,111,235,.1); }
  #f-link a:hover { background: rgba(31,111,235,.25); }

  /* probleme */
  #probleme { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .pb { display: flex; gap: 11px; background: #161b22; border: 1px solid #30363d;
        border-left: 3px solid #9e3b2e; border-radius: 9px; padding: 11px; }
  .pb img { width: 76px; height: 100px; object-fit: cover; border-radius: 6px; flex: 0 0 auto;
            cursor: pointer; }
  .pb b { color: #ffb4a2; display: block; }
  .pb small { color: #6e7681; }
  .pb p { margin: 6px 0 0; font-size: 12px; color: #8b949e; line-height: 1.5; }

  footer { margin-top: 42px; padding-top: 18px; border-top: 1px solid #21262d;
           color: #6e7681; font-size: 11.5px; line-height: 1.7; }

  /* lupa foto */
  #lupa { display: none; position: fixed; inset: 0; background: #010409; z-index: 200; }
  #lupa.on { display: flex; align-items: center; justify-content: center; }
  #lupa img { max-width: 96vw; max-height: 88vh; object-fit: contain; }
  #lupa-cap { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
              color: #8b949e; font-size: 12px; background: rgba(13,17,23,.85);
              border-radius: 6px; padding: 5px 11px; max-width: 90vw; text-align: center; }
  #lupa .x { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px;
             border-radius: 9px; }

  @media (max-width: 760px) {
    .wrap { padding: 18px 12px 60px; }
    #f-body { grid-template-columns: 1fr; gap: 14px; }
    #fisa { inset: 0; transform: none; width: auto; max-width: none; max-height: none;
            border: none; border-radius: 0; padding: 14px 15px 20px; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
    .card .ro { font-size: 13px; }
    .card .lat { font-size: 11px; }
    .card .verdict { display: none; }
    #filtre { gap: 5px; }
    .chip { padding: 6px 11px; }
  }
</style>
</head>
<body>
<div class="wrap">

<!--HEADER-->

<!--CONCLUZII-->

<div id="filtre"></div>
<div id="grid"></div>

<h2>Probleme identificate<span class="n">de rezolvat sau de evitat la tine</span></h2>
<div id="probleme"></div>

<!--FOOTER-->

</div>

<!-- fisa unei specii -->
<div id="bg" onclick="inchide()"></div>
<div id="fisa">
  <div id="fh">
    <div>
      <div id="f-ro"></div>
      <div id="f-lat"></div>
      <div id="f-tags"></div>
    </div>
    <button class="btn" onclick="inchide()" title="Închide">✕</button>
  </div>
  <div id="f-body">
    <div>
      <div id="f-poze"></div>
      <div style="margin-top:10px">
        <p class="sec">Ce s-a văzut în teren</p>
        <div id="f-nota"></div>
        <div id="f-prob"></div>
      </div>
    </div>
    <div>
      <p class="sec">Lumină</p>
      <div id="f-lum"></div>
      <div id="f-lumd"></div>
      <p class="sec">Înălțime estimată</p>
      <table class="kv" id="f-h"></table>
      <p class="sec">Udare în primii 2 ani <span style="text-transform:none;letter-spacing:0">(vara)</span></p>
      <table class="kv" id="f-w"></table>
      <p class="sec">Calendar fenologic — Ian › Dec</p>
      <div class="cal" id="f-cal"></div>
      <div class="calm" id="f-calm"></div>
      <div class="legenda" id="f-leg"></div>
      <p class="sec">Pentru amenajarea din Crucea</p>
      <div id="f-crucea"></div>
      <div id="f-link"></div>
    </div>
  </div>
</div>

<!-- foto pe tot ecranul -->
<div id="lupa" onclick="inchideLupa(event)">
  <button class="btn x" onclick="inchideLupa(event, true)">✕</button>
  <img id="lupa-img" alt="">
  <div id="lupa-cap"></div>
</div>

<script>
const TAXONI = /*TAXONI*/[];
const PROBLEME = /*PROBLEME*/[];

const LUNI = ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Nov','Dec'];
const TIP_RO  = { arbore:'Arbore', arbust:'Arbust', conifer:'Conifer', spontan:'Spontan' };
const STARE_RO = { repaus:'Repaus', persistent:'Frunziș peren', vegetatie:'Vegetație',
                   inflorire:'Înflorire', fructificare:'Fructificare' };
const STARE_EM = { repaus:'❄', persistent:'🌲', vegetatie:'🌿', inflorire:'🌸', fructificare:'🍒' };
const LUMINA = {
  soare: ['☀ Soare plin', '☀ Soare plin — minimum 6 h direct'],
  mixt:  ['⛅ Soare–semiumbră', '⛅ Soare până la semiumbră'],
  umbra: ['🌥 Semiumbră–umbră', '🌥 Semiumbră până la umbră']
};
const VERDICT = {
  retine: ['De reținut', 'v-retine'],
  evita:  ['De evitat',  'v-evita'],
  neutru: ['Cu rezerve', 'v-neutru']
};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nrPoza = p => String(parseInt(p.slice(1), 10));

/* ── grila ─────────────────────────────────────────────────────── */
let filtru = 'toate';

function chipuri() {
  const n = t => TAXONI.filter(x => t === 'toate' || x.tip === t).length;
  const lista = [['toate','Toate'],['arbore','Arbori'],['arbust','Arbuști'],
                 ['conifer','Conifere'],['spontan','Spontane']];
  document.getElementById('filtre').innerHTML =
    lista.map(([k, et]) =>
      '<button class="chip' + (k === filtru ? ' on' : '') + '" onclick="setFiltru(\'' + k + '\')">' +
      et + ' <span style="opacity:.6">' + n(k) + '</span></button>').join('') +
    '<button class="chip' + (filtru === 'plan' ? ' on' : '') + '" onclick="setFiltru(\'plan\')">' +
    'Și în planul Crucea <span style="opacity:.6">' + TAXONI.filter(x => x.inPlan).length + '</span></button>' +
    '<button class="chip' + (filtru === 'umbra' ? ' on' : '') + '" onclick="setFiltru(\'umbra\')">' +
    'Merg la umbră <span style="opacity:.6">' + TAXONI.filter(x => x.lum !== 'soare').length + '</span></button>' +
    '<button class="chip' + (filtru === 'prob' ? ' on' : '') + '" onclick="setFiltru(\'prob\')">' +
    'Cu probleme <span style="opacity:.6">' + TAXONI.filter(x => x.problema).length + '</span></button>';
}
function setFiltru(k) { filtru = k; chipuri(); grila(); }

function potrivit(t) {
  if (filtru === 'toate') return true;
  if (filtru === 'plan')  return !!t.inPlan;
  if (filtru === 'prob')  return !!t.problema;
  if (filtru === 'umbra') return t.lum !== 'soare';
  return t.tip === filtru;
}

function grila() {
  const g = document.getElementById('grid');
  g.innerHTML = TAXONI.filter(potrivit).map((t, i) => {
    const idx = TAXONI.indexOf(t);
    const [et, cls] = VERDICT[t.verdict];
    return '<article class="card" onclick="deschide(' + idx + ')">' +
      '<div class="ph"><img loading="lazy" src="poze/thumb/' + t.poze[0] + '.webp" alt="' +
        esc(t.ro) + '" onload="this.classList.add(\'gata\')"></div>' +
      '<div class="body">' +
        '<div class="ro">' + esc(t.ro) + '</div>' +
        '<div class="lat">' + esc(t.lat) + (t.cv ? ' ' + esc(t.cv) : '') + '</div>' +
        '<div class="tags">' + etichete(t) +
          '<span class="lumbadge l-' + t.lum + '">' + LUMINA[t.lum][0] + '</span></div>' +
        '<div class="verdict ' + cls + '"><b>' + et + '</b> — ' + esc(scurt(t.crucea)) + '</div>' +
      '</div></article>';
  }).join('');
}
function scurt(txt, n = 92) {
  if (txt.length <= n) return txt;
  const c = txt.slice(0, n), p = c.lastIndexOf(' ');
  return c.slice(0, p > 40 ? p : n) + '…';
}
function etichete(t) {
  let h = '<span class="tag t-' + t.tip + '">' + TIP_RO[t.tip] + '</span>';
  if (t.inPlan)  h += '<span class="tag plan">și în planul Crucea · ' + esc(t.inPlan) + '</span>';
  if (t.problema) h += '<span class="tag prob">problemă</span>';
  if (t.incert)  h += '<span class="tag incert">determinare probabilă</span>';
  return h;
}

/* ── fisa ──────────────────────────────────────────────────────── */
let cerere = 0;

function deschide(i) {
  const t = TAXONI[i];
  document.getElementById('f-ro').textContent  = t.ro;
  document.getElementById('f-lat').innerHTML   = esc(t.lat) + (t.cv ? ' <span style="font-style:normal;color:#6e7681">' + esc(t.cv) + '</span>' : '');
  document.getElementById('f-tags').innerHTML  = etichete(t);

  const pz = document.getElementById('f-poze');
  pz.className = t.poze.length === 1 ? 'una' : '';
  pz.innerHTML = t.poze.map(p =>
    '<a href="poze/mare/' + p + '.webp" onclick="lupa(event, \'' + p + '\', \'' +
      esc(t.ro).replace(/'/g, "\\'") + '\')">' +
    '<img loading="lazy" src="poze/thumb/' + p + '.webp" alt="Poza ' + nrPoza(p) + '">' +
    '<span>poza ' + nrPoza(p) + '</span></a>').join('');

  document.getElementById('f-nota').textContent = t.nota;
  document.getElementById('f-prob').innerHTML =
    t.problema ? '<b>Problemă observată.</b> ' + esc(t.problema) : '';

  const lu = document.getElementById('f-lum');
  lu.innerHTML = '<span class="lumbadge l-' + t.lum + '" style="font-size:12px;padding:3px 11px">' +
                 LUMINA[t.lum][1] + '</span>';
  document.getElementById('f-lumd').textContent = t.lumd || '';

  document.getElementById('f-h').innerHTML =
    '<tr><td>la 2 ani</td><td>' + esc(t.h2) + '</td></tr>' +
    '<tr><td>la 5 ani</td><td>' + esc(t.h5) + '</td></tr>' +
    '<tr><td>la maturitate</td><td>' + esc(t.hm) + '</td></tr>';

  const w = t.apa;
  document.getElementById('f-w').innerHTML = w
    ? '<tr><td>anul 1 (plantare)</td><td>' + udare(w, 1.5, 1) + '</td></tr>' +
      '<tr><td>anul 2</td><td>' + udare(w, 1.25, 0) + '</td></tr>' +
      '<tr><td>din anul 3</td><td>' + udare(w, 1, 0) + '</td></tr>'
    : '<tr><td colspan="2" style="color:#6e7681;text-align:left">Nu se plantează — specie spontană.</td></tr>';

  const cal = document.getElementById('f-cal'), calm = document.getElementById('f-calm');
  cal.innerHTML  = t.luni.map((s, m) => '<div class="s-' + s + '" title="' + LUNI[m] + ': ' +
                    STARE_RO[s] + '">' + STARE_EM[s] + '</div>').join('');
  calm.innerHTML = LUNI.map(l => '<span>' + l[0] + '</span>').join('');
  const stari = [...new Set(t.luni)];
  document.getElementById('f-leg').innerHTML = stari.map(s =>
    '<span><i class="s-' + s + '"></i>' + STARE_RO[s] + '</span>').join('');

  document.getElementById('f-crucea').textContent = t.crucea;

  // Linkurile se verifică la deschidere: adresa canonică vine de la Wikipedia,
  // iar dacă articolul nu există butonul devine căutare, nu pagină moartă.
  const lk = document.getElementById('f-link');
  lk.innerHTML =
    '<a id="lk-en" target="_blank" rel="noopener" href="' + wikiURL('en', t.en) + '">🔗 Wikipedia EN — ' + esc(t.en) + '</a>' +
    (t.row ? '<a id="lk-ro" target="_blank" rel="noopener" style="display:none" href="' + wikiURL('ro', t.row) + '"></a>' : '');
  verificaLinkuri(++cerere, t);

  document.getElementById('fisa').classList.add('on');
  document.getElementById('bg').classList.add('on');
  document.getElementById('fisa').scrollTop = 0;
}

function udare(w, k, plusFrecventa) {
  const l = w.l * k >= 10 ? Math.round(w.l * k / 5) * 5 : Math.max(1, Math.round(w.l * k));
  const f = w.f + plusFrecventa;
  return l + ' l × ' + f + '/săpt. — ' + (l * f) + ' l/săpt.';
}

function wikiURL(lang, titlu) {
  return 'https://' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(titlu.replace(/ /g, '_'));
}
function cautaURL(lang, titlu) {
  return 'https://' + lang + '.wikipedia.org/w/index.php?search=' +
         encodeURIComponent(titlu) + '&title=Special%3ASearch&go=Go';
}

const CACHE_KEY = '/*CACHE*/';
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {}; } catch (e) {}

async function rezumat(lang, titlu) {
  const k = lang + ':' + titlu;
  if (cache[k] && Date.now() - cache[k].ts < 30 * 24 * 3600 * 1000) return cache[k];
  const r = await fetch('https://' + lang + '.wikipedia.org/api/rest_v1/page/summary/' +
                        encodeURIComponent(titlu.replace(/ /g, '_')) + '?redirect=true');
  const rec = r.status === 404 ? { ts: Date.now(), lipsa: true }
            : { ts: Date.now(), url: (await r.json()).content_urls?.desktop?.page || wikiURL(lang, titlu) };
  cache[k] = rec;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
  return rec;
}

async function verificaLinkuri(nr, t) {
  try {
    const en = await rezumat('en', t.en);
    if (nr !== cerere) return;
    const a = document.getElementById('lk-en');
    if (a) {
      a.href = en.lipsa ? cautaURL('en', t.en) : en.url;
      a.textContent = (en.lipsa ? '🔎 Caută pe Wikipedia EN — ' : '🔗 Wikipedia EN — ') + t.en;
    }
  } catch (e) {}
  if (!t.row) return;
  try {
    const ro = await rezumat('ro', t.row);
    if (nr !== cerere) return;
    const a = document.getElementById('lk-ro');
    if (a && !ro.lipsa) {
      a.href = ro.url;
      a.textContent = '🔗 Wikipedia RO — ' + t.row;
      a.style.display = '';
    }
  } catch (e) {}
}

function inchide() {
  document.getElementById('fisa').classList.remove('on');
  document.getElementById('bg').classList.remove('on');
  cerere++;
}

/* ── probleme ──────────────────────────────────────────────────── */
function probleme() {
  document.getElementById('probleme').innerHTML = PROBLEME.map(p =>
    '<div class="pb">' +
      '<img loading="lazy" src="poze/thumb/' + p.poza + '.webp" alt="' + esc(p.titlu) + '" ' +
        'onclick="lupa(event, \'' + p.poza + '\', \'' + esc(p.titlu).replace(/'/g, "\\'") + '\')">' +
      '<div><b>' + esc(p.titlu) + '</b><small>' + esc(p.unde) + '</small>' +
      '<p>' + esc(p.text) + '</p></div>' +
    '</div>').join('');
}

/* ── lupa ──────────────────────────────────────────────────────── */
function lupa(ev, poza, cap) {
  if (ev) ev.preventDefault();
  document.getElementById('lupa-img').src = 'poze/mare/' + poza + '.webp';
  document.getElementById('lupa-cap').textContent = cap + ' — poza ' + nrPoza(poza);
  document.getElementById('lupa').classList.add('on');
}
function inchideLupa(ev, fortat) {
  if (!fortat && ev && ev.target.tagName === 'IMG') return;
  document.getElementById('lupa').classList.remove('on');
  document.getElementById('lupa-img').removeAttribute('src');
}

window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('lupa').classList.contains('on')) inchideLupa(null, true);
  else inchide();
});

chipuri(); grila(); probleme();
</script>
