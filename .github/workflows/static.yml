# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generează index.html din README.md
        run: |
          # marked rulează pe Node (preinstalat pe runner); GFM cu tabele e implicit
          npx --yes marked --gfm README.md -o body.html
          cat > index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ro">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Amenajare Proprietate — Crucea, Constanța</title>
          <style>
            :root { color-scheme: light dark; }
            body { margin: 0 auto; padding: 32px 20px 64px; max-width: 880px;
                   font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
                   color: #1f2328; background: #ffffff; }
            h1, h2 { border-bottom: 1px solid #d1d9e0; padding-bottom: .3em; }
            a { color: #0969da; text-decoration: none; }
            a:hover { text-decoration: underline; }
            table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
            th, td { border: 1px solid #d1d9e0; padding: 8px 12px; text-align: left; }
            th { background: #f6f8fa; }
            code, pre { background: #f6f8fa; border-radius: 6px;
                        font-family: ui-monospace, "Cascadia Code", monospace; font-size: 85%; }
            pre { padding: 14px; overflow-x: auto; }
            code { padding: 2px 5px; }
            pre code { padding: 0; }
            blockquote { margin: 0; padding: 0 1em; color: #59636e; border-left: 4px solid #d1d9e0; }
            @media (prefers-color-scheme: dark) {
              body { color: #f0f6fc; background: #0d1117; }
              h1, h2 { border-color: #3d444d; }
              a { color: #4493f8; }
              th, td { border-color: #3d444d; }
              th, code, pre { background: #151b23; }
              blockquote { color: #9198a1; border-color: #3d444d; }
            }
          </style>
          </head>
          <body>
          <main>
          HTML
          cat body.html >> index.html
          printf '</main>\n</body>\n</html>\n' >> index.html
          rm body.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
